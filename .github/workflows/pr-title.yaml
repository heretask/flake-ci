# Generated by flake-ci (ci.github). Do not edit manually.
# Regenerate with:
#   nix run .#write-files
jobs:
  lint:
    name: PR title lint
    runs-on: ubuntu-24.04
    steps:
    - env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        TITLE_PATTERN: '^(build|chore|ci|docs|feat|fix|improvement|perf|refactor|revert|style|test)(\([^()]+\))?!?:
          .{1,72}$'
      name: Lint PR title
      run: |-
        if [[ ! "$PR_TITLE" =~ $TITLE_PATTERN ]]; then
          printf 'Invalid PR title: %s\nExpected pattern: %s\n' "$PR_TITLE" "$TITLE_PATTERN" >&2
          exit 1
        fi
    timeout-minutes: 5
name: PR title
'on':
  pull_request:
    types:
    - opened
    - edited
    - reopened
    - synchronize
permissions:
  contents: read
