# Generated by flake-ci (ci.github). Do not edit manually.
# Regenerate with:
#   nix run .#write-files
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
jobs:
  flake-check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: flake-check
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout (v7.0.1)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Reclaim hosted runner disk
      run: |-
        df -h /

        remove() {
          local path="$1"
          local started="$SECONDS"
          sudo rm -rf -- "$path"
          printf 'Removed %s in %ss\n' "$path" "$((SECONDS - started))"
        }

        pids=()
        for path in \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/local/lib/android \
          /usr/share/dotnet
        do
          remove "$path" &
          pids+=("$!")
        done

        for pid in "${pids[@]}"; do
          wait "$pid"
        done

        df -h /
    - name: Install Determinate Nix (v23)
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
    - name: Enable hestia cache (v3.1.0)
      uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025
      with:
        upstream-cache-filter: 'true'
        version: v3.1.0
    - name: Check flake
      run: nix flake check -L --option accept-flake-config false
      timeout-minutes: 20
    timeout-minutes: 30
  publish:
    name: Publish Nix result
    needs: flake-check
    permissions:
      statuses: write
    runs-on: ubuntu-24.04
    steps:
    - env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      name: Sign off on the tested commit
      run: |-
        gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
          -f context=signoff -f state=success -f 'description=Nix PR checks passed' \
          -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
    timeout-minutes: 5
name: Nix PR
'on':
  pull_request: {}
permissions:
  contents: read
