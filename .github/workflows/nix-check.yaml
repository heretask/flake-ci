# Generated by flake-ci (ci.github). Do not edit manually.
# Regenerate with:
#   nix run .#write-files
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.sha }}
jobs:
  flake-check:
    name: flake-check
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout (v7.0.1)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Make room for Nix (nothing-but-nix v12)
      uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2
      with:
        hatchet-protocol: carve
    - name: Install Determinate Nix (v23)
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
    - name: Enable hestia cache (v3.1.0)
      uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025
      with:
        upstream-cache-filter: 'true'
        version: v3.1.0
    - env:
        HEAD_SHA: ${{ github.sha }}
      if: github.event_name == 'push'
      name: Lint pushed commit
      run: |-
        git show --no-patch --format=%B "$HEAD_SHA" |
          nix run --option accept-flake-config false .#commitlint -- --squash-merged
    - name: Check flake
      run: nix flake check -L --option accept-flake-config false
      timeout-minutes: 20
    timeout-minutes: 30
name: Nix
'on':
  push:
    branches:
    - main
permissions:
  contents: read
