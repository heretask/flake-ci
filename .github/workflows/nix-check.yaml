# Generated by flake-ci (ci.github). Do not edit manually.
# Regenerate with:
#   nix run .#write-files
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.sha }}
jobs:
  flake-check:
    name: flake-check
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout (v7.0.1)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Reclaim hosted runner disk
      run: |-
        df -h /

        remove() {
          local path="$1"
          local started="$SECONDS"
          sudo rm -rf -- "$path"
          printf 'Removed %s in %ss\n' "$path" "$((SECONDS - started))"
        }

        pids=()
        for path in \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/local/lib/android \
          /usr/share/dotnet
        do
          remove "$path" &
          pids+=("$!")
        done

        for pid in "${pids[@]}"; do
          wait "$pid"
        done

        df -h /
    - name: Install Determinate Nix (v22)
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
    - name: Enable Magic Nix Cache (v14)
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
    - env:
        HEAD_SHA: ${{ github.sha }}
      if: github.event_name == 'push'
      name: Lint pushed commit
      run: |-
        git show --no-patch --format=%B "$HEAD_SHA" |
          nix run --option accept-flake-config false .#commitlint
    - name: Check flake
      run: nix flake check -L --option accept-flake-config false
    timeout-minutes: 30
name: Nix
'on':
  push:
    branches:
    - main
permissions:
  contents: read
