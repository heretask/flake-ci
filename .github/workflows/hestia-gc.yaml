concurrency:
  cancel-in-progress: false
  group: hestia-gc
jobs:
  gc:
    name: hestia-gc
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - name: Install Determinate Nix (v23)
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
    - name: Enable hestia cache (v3.1.0)
      uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025
      with:
        version: v3.1.0
    - env:
        GITHUB_TOKEN: ${{ github.token }}
      name: Run garbage collection
      run: '"$HESTIA_BIN" gc ${{ inputs.dry-run && ''--dry-run'' || '''' }}'
    timeout-minutes: 15
name: Hestia cache GC
'on':
  schedule:
  - cron: 23 3 * * *
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
permissions:
  contents: read
